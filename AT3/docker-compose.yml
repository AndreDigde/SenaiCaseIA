services:
  db:
    image: postgres:13
    env_file: .env
    ports:
      - "5432:5432"

  web:
    build: .
    command: bash -c "python manage.py migrate && python create_user.py && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
